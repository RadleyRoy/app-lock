name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with versionName ships an APK whose in-app version is a lie,
      # and Android would refuse the next upgrade if versionCode went backwards.
      - name: Check the tag matches versionName
        run: |
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=${{ steps.version.outputs.version }} build.gradle.kts=$DECLARED"
          if [ "$DECLARED" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match versionName $DECLARED"
            exit 1
          fi

      # A failing test must block a release, so this runs before anything is built.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; falling back to the debug key."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/latch-release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Built as a step output rather than inline in the release body. GitHub's `a && b || c`
      # is not a ternary: when b is an empty string it is falsy, so the expression falls
      # through to c and every release gets the unsigned warning whether or not it is true.
      - name: Compose the signing note
        id: note
        run: |
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            echo "text=" >> "$GITHUB_OUTPUT"
          else
            echo "text=> [!WARNING] Built without a release keystore, so this APK is debug-signed and cannot upgrade over a properly signed install." >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        env:
          LATCH_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && format('{0}/latch-release.jks', runner.temp) || '' }}
          LATCH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LATCH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LATCH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the artifact
        id: artifact
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="latch-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs "${{ steps.artifact.outputs.path }}"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/latch-release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Latch ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
          body: |
            Install by downloading the APK below and opening it on your phone. You will need
            to allow installing from unknown sources.

            After installing, open Latch and work through the setup wizard — the accessibility
            and overlay grants are both required for locking to work at all, and on Samsung
            devices you should also set the battery mode to **Unrestricted** or One UI will
            eventually stop protection without telling you.

            ${{ steps.note.outputs.text }}
